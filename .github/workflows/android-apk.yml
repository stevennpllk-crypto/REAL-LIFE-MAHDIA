name: Android APK build

on:
  push:
    branches: [ main, feature/expanded-mahdia-world ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep only the newest build for main; stale runs waste emulator minutes.
concurrency:
  group: mahdia-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache resident models and PBR textures
        id: assets-cache
        uses: actions/cache@v4
        with:
          path: |
            assets/characters
            assets/textures
          key: mahdia-assets-v1-${{ runner.os }}

      - name: Cache Godot 4.3 export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: mahdia-godot-4.3-templates-v1-${{ runner.os }}

      - name: Cache glTF Transform npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: mahdia-gltf-transform-npm-v1-${{ runner.os }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [[ ! -x "$SDK_ROOT/platform-tools/adb" || ! -d "$SDK_ROOT/platforms/android-34" || ! -d "$SDK_ROOT/build-tools/34.0.0" || ! -d "$SDK_ROOT/cmake/3.10.2.4988404" || ! -d "$SDK_ROOT/ndk/23.2.8568313" ]]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          else
            echo "Android SDK components already installed; skipping sdkmanager downloads."
          fi

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Download licensed rigged resident characters
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p assets/characters
          curl --fail --location --retry 3 https://models.codelove.in/models/male-adult-01.glb -o assets/characters/male-adult-01.glb
          curl --fail --location --retry 3 https://models.codelove.in/models/male-adult-02.glb -o assets/characters/male-adult-02.glb
          curl --fail --location --retry 3 https://models.codelove.in/models/female-adult-02.glb -o assets/characters/female-adult-02.glb
          curl --fail --location --retry 3 https://models.codelove.in/models/female-party-01.glb -o assets/characters/female-party-01.glb
          test "$(find assets/characters -maxdepth 1 -name '*.glb' -type f | wc -l)" -eq 4
          du -h assets/characters/*.glb

      # Godot 4.3 does not import the source models' meshopt/quantized
      # geometry extensions. Decode meshopt and restore float attributes first.
      - name: Convert resident GLBs to Godot-compatible geometry
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          npm install --global @gltf-transform/cli
          for source in assets/characters/*.glb; do
            converted="${source%.glb}.godot.glb"
            gltf-transform dequantize "$source" "$converted"
            test -s "$converted"
            mv "$converted" "$source"
          done
          echo "Converted resident models:"
          du -h assets/characters/*.glb


      - name: Download CC0 PBR textures for Mahdia streets and facades
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p assets/textures
          for asset in plastered_wall cobblestone_pavement; do
            base="https://dl.polyhaven.org/file/ph-assets/Textures"
            curl --fail --location --retry 3 "$base/jpg/1k/$asset/${asset}_diff_1k.jpg" -o "assets/textures/${asset}_diff_1k.jpg"
            curl --fail --location --retry 3 "$base/png/1k/$asset/${asset}_nor_gl_1k.png" -o "assets/textures/${asset}_nor_gl_1k.png"
            curl --fail --location --retry 3 "$base/jpg/1k/$asset/${asset}_rough_1k.jpg" -o "assets/textures/${asset}_rough_1k.jpg"
            test -s "assets/textures/${asset}_diff_1k.jpg"
          done
          du -h assets/textures/*

      - name: Verify cached and downloaded visual assets
        run: |
          set -euxo pipefail
          test "$(find assets/characters -maxdepth 1 -name '*.glb' -type f | wc -l)" -eq 4
          test -s assets/textures/plastered_wall_diff_1k.jpg
          test -s assets/textures/cobblestone_pavement_diff_1k.jpg
          du -h assets/characters/*.glb assets/textures/*

      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate Android toolchain and import project
        run: |
          set -euxo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/cmdline-tools/latest"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          "$ANDROID_HOME/platform-tools/adb" version
          godot --headless --editor --path . --quit

      - name: Run deterministic gameplay regression tests
        run: |
          set -euxo pipefail
          timeout 90s godot --headless --path . --script res://tests/test_mobile_movement.gd
          echo "Gameplay regression suite completed successfully."

      - name: Inspect imported player GLB rig and mesh transforms
        run: |
          set -euxo pipefail
          timeout 45s godot --headless --path . --script res://tests/inspect_player_glb.gd | tee build-player-asset-diagnostic.log
          grep -q "PLAYER_ASSET_DIAGNOSTIC_COMPLETE" build-player-asset-diagnostic.log
          grep -q "PLAYER_ASSET_HEAD" build-player-asset-diagnostic.log
          grep -q "PLAYER_ASSET_PELVIS" build-player-asset-diagnostic.log

      - name: Set monotonically increasing Android version code
        run: |
          set -euxo pipefail
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          grep "^version/code=" export_presets.cfg

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/REAL_LIFE_MAHDIA-debug.apk
          test -s build/REAL_LIFE_MAHDIA-debug.apk
          file build/REAL_LIFE_MAHDIA-debug.apk

      # Publish the APK immediately: emulator startup must never block delivery.
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: REAL-LIFE-MAHDIA-Android-APK
          path: build/REAL_LIFE_MAHDIA-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Keep the GLES Compatibility APK for older devices, but test a
      # Vulkan Mobile-renderer build separately. SwiftShader GLES has a known
      # 261-uniform linker failure unrelated to this project's light settings.
      - name: Export Android Mobile Vulkan variant
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text()
          s = s.replace('config/features=PackedStringArray("4.3", "GL Compatibility")', 'config/features=PackedStringArray("4.3", "Mobile")')
          s = s.replace('renderer/rendering_method="gl_compatibility"', 'renderer/rendering_method="mobile"')
          s = s.replace('renderer/rendering_method.mobile="gl_compatibility"', 'renderer/rendering_method.mobile="mobile"')
          assert 'renderer/rendering_method.mobile="mobile"' in s
          p.write_text(s)
          PY
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug "Android" build/REAL_LIFE_MAHDIA-mobile.apk
          test -s build/REAL_LIFE_MAHDIA-mobile.apk
          file build/REAL_LIFE_MAHDIA-mobile.apk

      - name: Upload Android Mobile Vulkan APK
        uses: actions/upload-artifact@v4
        with:
          name: REAL-LIFE-MAHDIA-Android-Mobile-Vulkan-APK
          path: build/REAL_LIFE_MAHDIA-mobile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Select GLES Compatibility APK for emulator smoke test
        run: |
          set -euxo pipefail
          test -s build/REAL_LIFE_MAHDIA-debug.apk
          file build/REAL_LIFE_MAHDIA-debug.apk
          unzip -t build/REAL_LIFE_MAHDIA-debug.apk >/dev/null
          # Keep Vulkan as a separately downloadable build. The hosted emulator
          # uses SwiftShader GLES, so smoke-test the Compatibility APK here.

      - name: Prepare KVM and ADB for emulator
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is not exposed by this runner; emulator will use software acceleration."
          fi
          "$ANDROID_HOME/platform-tools/adb" start-server
          "$ANDROID_HOME/platform-tools/adb" version
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Preinstall emulator system image with retry
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          IMAGE='system-images;android-35;google_apis;x86_64'
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print >&2 || true
            exit 1
          fi
          # sdkmanager may close stdin after accepting all licenses; with pipefail,
          # that makes the upstream `yes` exit via SIGPIPE (141) despite success.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$license_status" -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit code $license_status" >&2
            exit "$license_status"
          fi
          for attempt in 1 2 3; do
            echo "Installing emulator image (attempt $attempt/3)"
            if "$SDKMANAGER" --install "$IMAGE"; then
              test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
              echo "Android emulator image installed successfully."
              break
            fi
            rm -rf "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
            rm -rf "$HOME/.android/cache"/* 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "Android emulator system image download failed after three attempts" >&2
              exit 1
            fi
            sleep 8
          done

      - name: Test APK on cloud Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 420
          disable-linux-hw-accel: false
          # Use a newer Pixel 6 / Android 15 image with more memory; KVM is preferred when available.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke-test.sh

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REAL-LIFE-MAHDIA-Emulator-Evidence
          path: |
            build/mahdia-emulator.png
            build/mahdia-player-ready.png
            build/mahdia-world-ready.png
            build/emulator-logcat.txt
            build/android-system-logcat.txt
          if-no-files-found: warn
          retention-days: 7
