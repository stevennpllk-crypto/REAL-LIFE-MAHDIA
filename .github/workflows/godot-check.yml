name: Godot project validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project with Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Run main scene briefly
        run: timeout 20s godot --headless --path . --quit-after 5
