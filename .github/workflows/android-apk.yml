name: Android APK build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate Android toolchain and import project
        run: |
          set -euxo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/cmdline-tools/latest"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          "$ANDROID_HOME/platform-tools/adb" version
          godot --headless --editor --path . --quit

      - name: Set monotonically increasing Android version code
        run: |
          set -euxo pipefail
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          grep "^version/code=" export_presets.cfg

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/REAL_LIFE_MAHDIA-debug.apk
          test -s build/REAL_LIFE_MAHDIA-debug.apk
          file build/REAL_LIFE_MAHDIA-debug.apk

      # Publish the APK immediately: emulator startup must never block delivery.
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: REAL-LIFE-MAHDIA-Android-APK
          path: build/REAL_LIFE_MAHDIA-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Test APK on cloud Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            set -euxo pipefail
            mkdir -p build
            capture_emulator_evidence() {
              adb logcat -d -t 4000 > build/emulator-logcat.txt 2>&1 || true
              adb shell screencap -p /sdcard/mahdia-emulator.png >/dev/null 2>&1 || true
              adb pull /sdcard/mahdia-emulator.png build/mahdia-emulator.png >/dev/null 2>&1 || true
            }
            trap capture_emulator_evidence EXIT
            adb wait-for-device
            echo "Waiting for Android boot and Package Manager..."
            package_ready=false
            for attempt in $(seq 1 90); do
              boot_state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              package_state="$(adb shell service check package 2>&1 || true)"
              echo "Readiness attempt $attempt: boot=$boot_state; $package_state"
              if [ "$boot_state" = "1" ] && echo "$package_state" | grep -qi "found"; then
                package_ready=true
                break
              fi
              sleep 2
            done
            if [ "$package_ready" != "true" ]; then
              echo "Android Package Manager did not become ready"
              exit 1
            fi
            adb shell cmd package list packages >/dev/null
            adb install -r build/REAL_LIFE_MAHDIA-debug.apk
            adb shell monkey -p com.jassim.reallifemahdia 1
            sleep 30
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'
            adb logcat -d -t 4000 > build/emulator-logcat.txt
            if grep -E 'FATAL EXCEPTION|SIGSEGV|Fatal signal' build/emulator-logcat.txt; then
              echo "Fatal application error detected"
              exit 1
            fi

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REAL-LIFE-MAHDIA-Emulator-Evidence
          path: |
            build/mahdia-emulator.png
            build/emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 7
